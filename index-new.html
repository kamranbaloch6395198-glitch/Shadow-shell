<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberLab - Security Testing Portal</title>
    <style>
        body {
            background-color: #0d1117;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background-color: #161b22;
            padding: 30px;
            border: 1px solid #00ff41;
            border-radius: 8px;
            width: 300px;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
            text-align: center;
        }
        h2 {
            margin-top: 0;
            letter-spacing: 2px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #ffffff;
            border-radius: 4px;
        }
        button {
            width: 98%;
            padding: 10px;
            background-color: #00ff41;
            color: #0d1117;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #00cc33;
        }
        #message {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>[ CYBERLAB ]</h2>
    <p style="font-size: 12px; color: #8b949e;">Authorized Testing Only</p>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="checkLogin()">ACCESS SYSTEM</button>
    <div id="message"></div>
</div>

<script>
    function checkLogin() {
        var user = document.getElementById("username").value;
        var pass = document.getElementById("password").value;
        var msg = document.getElementById("message");

        // Intentional Vulnerability 1: Hardcoded Credentials in Client-Side JS
        if (user === "admin" && pass === "admin123") {
            msg.style.color = "#00ff41";
            msg.innerHTML = "Access Granted! Welcome Admin.";
        } else {
            msg.style.color = "#ff4444";
            // Intentional Vulnerability 2: Reflected XSS (innerHTML without sanitization)
            msg.innerHTML = "Access Denied for user: " + user;
        }
    }
<script>
document.querySelector("form").onsubmit = function(e) {
    e.preventDefault();
    let inputs = document.querySelectorAll("input");
    if (inputs.value === "admin" && inputs.value === "1234") {
        alert("Access Granted! Welcome to Shadow - Shell");
    } else {
        alert("Access Denied: Invalid Username or Password!");
    }
};
</script>
